<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Shaders · panel dashboard</title>

<!--
  Shaders — a Golden Layout panel dashboard for the shader background,
  structured just like ../dash/index.html. Each panel hosts an iframe that
  loads one of the shader split pages (preview / presets / controls / full);
  those pages already sync state between themselves over the broker
  (room `bg/<password>`), so this dashboard just arranges them and lets you
  drag / resize / add more. Append a #hash to share a broker session across
  every panel (config.js carries it over via propagateHash).

  This file is just the shell — the shared chrome lives in
    ../css/panel-frame.css   ../js/panel-frame.js
  and this dashboard's catalog + default layout live in
    ./config.js
  Dependencies are vendored under ../vendor/ (jQuery + Golden Layout).
-->

<link rel="stylesheet" href="../vendor/golden-layout/1.5.9/css/goldenlayout-base.css" />
<link rel="stylesheet" href="../vendor/golden-layout/1.5.9/css/goldenlayout-dark-theme.css" />
<link rel="stylesheet" href="../css/panel-frame.css" />
</head>
<body>

<header class="toolbar">
  <span class="brand">◆ Shaders</span>

  <div class="combo" id="addCombo">
    <input id="addInput" type="text" autocomplete="off" spellcheck="false"
           placeholder="Search panel (click result) or paste URL + Enter" />
    <button id="addBtn" title="Add panel (Enter)">＋ Add</button>
    <ul id="addResults" class="combo-results" hidden></ul>
  </div>

  <span class="spacer"></span>

  <a class="hint-link" href="./controller.html" title="The original single-page controller">all-in-one</a>
  <a class="hint-link" href="./full.html" target="_blank" title="Open the program overlay (OBS / display)">full ⤴</a>
  <span class="sep"></span>
  <button id="exportBtn"  class="icon" title="Export layout as JSON file">⤓</button>
  <button id="importBtn"  class="icon" title="Import layout from JSON file">⤴</button>
  <input id="importFile" type="file" accept="application/json,.json" hidden />
  <button id="resetBtn"   class="icon" title="Reset to the default layout">↺</button>
  <span id="status" class="status">ready</span>
</header>

<div id="layout"></div>
<pre id="fatal"></pre>

<!-- jQuery (required by Golden Layout 1.x) + Golden Layout 1.5.9 — both vendored -->
<script src="../vendor/jquery/3.7.1/jquery.min.js"></script>
<script src="../vendor/golden-layout/1.5.9/goldenlayout.min.js"></script>

<!-- This dashboard's catalog + default layout, then the shared framework -->
<script src="../js/golden-layout-default.js"></script>
<script src="./config.js"></script>
<script src="../js/panel-frame.js"></script>

</body>
</html>
