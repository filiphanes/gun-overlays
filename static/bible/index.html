<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"/>
<meta name="HandheldFriendly" content="true" />
<meta http-equiv="X-UA-Compatible" content="ie=edge" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-touch-fullscreen" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Biblia ovládač</title>

<style>
html, body {
  position: relative;
  width: 100%;
  height: 100%;
  user-select: none;
}
body {
  background: black;
  color: white;
  margin: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
}
a { color: lightblue; }

/* ---- form controls ---- */
input, button, select {
  font-family: inherit;
  font-size: inherit;
  padding: 0.4em;
  margin: 0 0 0.25em 0;
  box-sizing: border-box;
  border: none;
  background: #555;
  color: whitesmoke;
  border-radius: .5rem;
}
input:disabled { color: #ccc; }
button {
  color: whitesmoke;
  background-color: #555;
  font-size: 1rem;
  outline: none;
  margin: 0;
  line-height: 2rem;
  width: 3rem;
  border: 1px solid black;
  border-radius: .5rem;
  user-select: none;
}
button:active { background-color: #ddd; color: black; }
button:focus { border-color: #666; }
.control-button { width: 6rem; }
.spacer { background: transparent; }

/* ---- book filter + history lists ---- */
.input-group { width: 100%; display: flex; }
.input-group input { flex-grow: 1; }

/* two search boxes side by side: book/address (left) + content (right) */
.search-row { display: flex; gap: .5rem; width: 100%; margin: 0 0 .25rem 0; }
.search-row > .input-group { flex: 1 1 50%; margin: 0; min-width: 0; }

/* content-search results dropdown */
.search-results {
  max-height: 30rem;
  overflow: auto;
  background: #111;
  border-radius: .5rem;
  padding: .2rem 0;
  margin: 0 0 .5rem;
}
.search-results:empty { display: none; }
.search-results.closed { display: none; }
.search-results .hit {
  display: flex;
  align-items: baseline;
  width: max-content;
  min-width: 100%;
  text-align: left;
  border: none;
  border-left: 2px solid transparent;
  border-radius: 0;
  background: #111;
  padding: .15rem 0;
  line-height: 1.25;
  font-size: .9em;
}
.search-results .hit:hover, .search-results .hit:focus { background: #333; border-left-color: #9cf; }
/* The whole list shares one horizontal scrollbar (each row sizes to its
   content). The reference stays pinned at the left while you scroll, so the
   verse address is always visible; its background mirrors the row's (incl.
   hover/focus) to occlude the text scrolling underneath it. */
.search-results .hit .ref {
  color: #9cf;
  flex: 0 0 auto;
  white-space: nowrap;
  position: sticky;
  left: 0;
  background: #111;
  padding: 0 .5rem;
  z-index: 1;
}
.search-results .hit:hover .ref,
.search-results .hit:focus .ref { background: #333; }
.search-results .hit .text {
  flex: 0 0 auto;
  white-space: nowrap;
  color: #ccc;
  padding-right: .5rem;
}
.search-results .placeholder { padding: .5rem; color: #777; }

/* control row: books + history + number pads.
   On wide screens they sit side by side and every column stretches to the
   tallest (the number-pad column), so the book/history lists match its height
   and scroll internally. On narrow screens it wraps like the old float layout. */
.control-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: .5rem;
}
.control-row > .books-filter,
.control-row > .address-filter {
  display: block;
  width: 49%;
  margin: 0;
  padding: 0;
  height: 12rem;
  overflow: scroll;
  max-width: 13rem;
}
.control-row > .control-block { margin: 0; vertical-align: top; }

@media (min-width: 50rem) {
  .control-row { flex-wrap: nowrap; align-items: flex-start; }
  .control-row > .books-filter,
  .control-row > .address-filter {
    flex: 1 1 12rem;
    width: auto;
    max-width: 13rem;
    height: 20rem;  /* just above the number-pad grid + Show/Hide button */
  }
  .control-row > .control-block { flex: 0 0 auto; }
}

.book-item,
.address-set,
.address-remove {
  width: 100%;
  margin: 0 0 .1rem;
  padding: .3rem;
  text-align: left;
  color: whitesmoke;
  border-radius: 0;
  background: black;
}
.address-item {
  width: 100%;
  padding: 0;
  margin: 0;
  max-width: 30rem;
  display: flex;
}
.address-set    { width: auto; padding: .5rem; margin: 0; text-align: left; flex-grow: 2; }
.address-remove { margin: 0; max-width: 2rem; padding: .25rem .5rem; line-height: 1rem; }

/* ---- chapter / verse control blocks ---- */
.control-block { display: inline-block; margin: .5rem; vertical-align: top; }

/* ---- previews ---- */
.preview { padding: .5rem; user-select: text; }
.preview.next { color: #777; }

.btn-success { background-color: green; }
.btn-danger  { background-color: red; }

.settings { padding: .5rem; }

/* ---- reactive fragment (display: contents) ---- */
.live { display: contents; }

/* ---- number pad ---- */
.numberpad {
  display: grid;
  grid-template-columns: repeat(3, 3rem);
  grid-template-rows: repeat(4, 3rem);
  grid-gap: 0;
  margin: 0 0 0.5rem 0;
}
.numberpad button { background-color: transparent; border: none; }
.numberpad button:active { background-color: #ccc; }
.numberpad button:hover,
.numberpad button:focus { background-color: #333; }
</style>

<script type="module">
import van from "../js/van.js";
import { multiBrokerState } from "../js/broker.js";

/* ═══════════════════════ Bible indexes ═══════════════════════ */
import { index as roh }  from "./roh.json.js";
import { index as seb }  from "./seb.json.js";
import { index as sep }  from "./sep.json.js";
import { index as ssv }  from "./ssv.json.js";
import { index as bot }  from "./bot.json.js";
import { index as csp }  from "./csp.json.js";
import { index as kjv }  from "./kjv.json.js";
import { index as nlt }  from "./nlt.json.js";
import { index as nkjv } from "./nkjv.json.js";
import { index as amp }  from "./amp.json.js";
import { index as ampc } from "./ampc.json.js";

const { div, span, input, button, select, option, label, br } = van.tags;

/* ═══════════════════════ Bible data ═══════════════════════ */
const bibles = {};
for (const [id, bible] of Object.entries({ roh, seb, sep, ssv, bot, csp, kjv, nlt, nkjv, amp, ampc })) {
  bibles[id] = { ...bible };
  bibles[id].books = {};
  let i = 0;
  for (const book of bibles[id].bookslist) {
    book.index = i++;
    bibles[id].books[book.abbreviation] = book;
  }
}
// Option *specs* (plain data) so every <select> builds its own fresh <option> nodes.
// (Sharing DOM <option> nodes between selects would empty the first one, because a
// node can only live in one place — appending it elsewhere moves it.)
const bibleOptionSpecs = Object.entries(bibles).map(([id, bible]) => ({ value: id, label: bible.name }));

/* ═══════════════════════ Chapter loading ═══════════════════════
   Static bibles = one file per book (loaded whole); API bibles fetch a single
   chapter from bolls.life. Results are written into the mutable bible tree and
   dataVersion is bumped so any derive reading chapter data re-evaluates
   (VanJS has no deep reactivity on plain objects, unlike Svelte's $state). */

const dataVersion = van.state(0);
const inflight = new Map();
const CACHE_PREFIX = "bible-chapter:";
const CACHE_VERSION = 1;

const cacheKey   = (b, a, c) => `${CACHE_PREFIX}${CACHE_VERSION}:${b}:${a}:${c}`;
const readCache  = (b, a, c) => { try { return JSON.parse(localStorage.getItem(cacheKey(b, a, c)) || "null"); } catch { return null; } };
const writeCache = (b, a, c, v) => { try { localStorage.setItem(cacheKey(b, a, c), JSON.stringify(v)); } catch { /* quota */ } };

async function ensureChapter(bibleid, abbreviation, chapter) {
  if (!bibleid || !abbreviation || !chapter) return;
  const book = bibles[bibleid]?.books?.[abbreviation];
  if (!book || book.chapters?.[chapter]) return;
  const key = `${bibleid}:${abbreviation}:${chapter}`;
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    try {
      let verses = readCache(bibleid, abbreviation, chapter);
      if (!verses) {
        if (bibles[bibleid].api) {
          verses = await fetchChapterFromApi(bibles[bibleid].api, book, chapter);
          writeCache(bibleid, abbreviation, chapter, verses);
        } else {
          // static: one local file holds the whole book — fill every chapter
          const all = await fetchStaticBook(bibleid, abbreviation);
          book.chapters ??= {};
          for (const ch of Object.keys(all)) book.chapters[ch] = all[ch];
          dataVersion.val++;
          return;
        }
      }
      book.chapters ??= {};
      book.chapters[chapter] = verses;
      dataVersion.val++;
    } finally {
      inflight.delete(key);
    }
  })();
  inflight.set(key, p);
  return p;
}

async function fetchStaticBook(bibleid, abbreviation) {
  const res = await fetch(`/bible/${bibleid}/${abbreviation}.json`);
  return res.json();
}

async function fetchChapterFromApi(api, book, chapter) {
  // bolls.life: GET /get-text/{translation}/{bookNumber}/{chapter}/ -> [{verse, text}, ...]
  const res = await fetch(`${api.base}/get-text/${api.translation}/${book.index + 1}/${chapter}/`);
  const verses = await res.json();
  const arr = [];
  for (const v of verses) {
    const n = (v.verse || 1) - 1;
    arr[n] = (arr[n] ? arr[n] + " " : "") + v.text;
  }
  return arr;
}

/* ═══════════════════════ State ═══════════════════════ */
const defaultAddress = { bible: "roh", book: "gn", chapter: 1, verse: 1, vcount: 1 };

const s = multiBrokerState({
  show: false,
  line1: "", line2: "", line3: "", line4: "",
  bible: "roh", book: "gn", chapter: 1, verse: 1, vcount: 1,
  bible2: "", theme: "",
  history: [defaultAddress],
  program: {},
  verseNumbers: false,
  showTranslation: false,
  showNextVerses: true,
  hideOnSelector: true,
  splitButton: false,
});

const history = van.state([defaultAddress]);   // local UI history (not broadcast)
const bookFilter = van.state("");

/* ═══════════════════════ Full-text content search ═══════════════════════
   A Web Worker (search.worker.js) loads the prebuilt binary inverted index
   for the current translation (built by scripts/build_search_indexes.mjs) and
   answers queries off the main thread. API-backed translations (no local
   text) have no index and fall back to disabled. See
   static/bible/search/COMPARISON.md for why binverted is the only shipped one. */
const contentQuery = van.state("");
const searchResults = van.state([]);           // [{ ref, snippet }]
const searchStatus = van.state("");            // "", "loading", "ready", "error", "No index"
const searchOpen = van.state(true);            // dropdown visibility tied to input focus/blur
const hasSearchIndex = (bibleId) => bibles[bibleId] && !bibles[bibleId].api;

let _searchWorker = null, _searchLoaded = null, _searchReqId = 0, _searchReqBible = null, _searchDebounce = null, _searchBlurTimer = null;
// Two-Enter state for content-search hits: first Enter applies the address,
// the next Enter on the same hit toggles Show. Reset on every new search.
let lastAppliedHit = null;
// packed address table per bible: Uint8Array, 3 bytes/verse [bookIdx, chapter, verse].
// Loaded lazily from {bible}.addr.bin; ids returned by the worker index into it.
const _addrCache = {};   // bibleId -> Promise<Uint8Array>
function addrTable(bibleId) {
  if (!_addrCache[bibleId])
    _addrCache[bibleId] = fetch(`/bible/search/${bibleId}.addr.bin`)
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
      .then(b => new Uint8Array(b));
  return _addrCache[bibleId];
}
// doc id -> { book (abbr), chapter, verse, vcount }
async function idToAddress(bibleId, id) {
  const addr = await addrTable(bibleId);
  const bookIdx = addr[id * 3], chapter = addr[id * 3 + 1], verse = addr[id * 3 + 2];
  const abbr = bibles[bibleId]?.bookslist?.[bookIdx]?.abbreviation;
  return { book: abbr, chapter, verse, vcount: 1 };
}
function searchWorker() {
  if (_searchWorker) return _searchWorker;
  _searchWorker = new Worker(new URL("./search.worker.js", import.meta.url), { type: "module" });
  _searchWorker.onmessage = (e) => {
    const m = e.data || {};
    if (m.type === "ready") { _searchLoaded = m.bible; searchStatus.val = "ready"; runContentSearch(); }
    else if (m.type === "results") {
      if (m.id !== _searchReqId) return;        // stale
      const bible = _searchReqBible;
      Promise.all((m.ids || []).slice(0, 50).map(id => idToAddress(bible, id).then(a => ({ id, bible, address: a }))))
        .then(rows => { searchResults.val = rows; searchStatus.val = m.ms != null ? `ready (${m.ms.toFixed(1)}ms)` : "ready"; scheduleSnippetLoad(rows); });
    } else if (m.type === "error") {
      searchStatus.val = "error"; searchResults.val = [];
    }
  };
  return _searchWorker;
}
function runContentSearch() {
  const q = contentQuery.val.trim();
  if (!q) { searchResults.val = []; searchStatus.val = ""; lastAppliedHit = null; return; }
  const bible = s.bible;
  if (!hasSearchIndex(bible)) { searchResults.val = []; searchStatus.val = "No index"; lastAppliedHit = null; return; }
  const w = searchWorker();
  if (_searchLoaded !== bible) { searchStatus.val = "loading"; w.postMessage({ type: "load", bible }); return; }
  _searchReqId++;
  _searchReqBible = bible;
  lastAppliedHit = null;
  w.postMessage({ type: "search", id: _searchReqId, query: q, bible });
}
function onContentInput(e) {
  contentQuery.val = e.target.value;
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(runContentSearch, 180);
}

// Keep the content-search dropdown open while the input or any result button
// holds focus; hide it shortly after focus leaves both. The short timeout
// lets focus travel between the input and a result button (on click or
// ArrowDown) without the dropdown flickering closed in between.
function keepSearchOpen() { clearTimeout(_searchBlurTimer); searchOpen.val = true; }
function scheduleSearchHide() {
  clearTimeout(_searchBlurTimer);
  _searchBlurTimer = setTimeout(() => { searchOpen.val = false; }, 150);
}

// Lazy-load chapter text for the current hits (debounced). `ensureChapter` for
// static bibles fetches a whole book, so we coalesce shortly after results
// settle rather than on every keystroke; the dataVersion bump re-renders
// snippets reactively via the `() => snippet(r)` children.
let _snippetDebounce = null;
function scheduleSnippetLoad(rows) {
  clearTimeout(_snippetDebounce);
  _snippetDebounce = setTimeout(() => {
    for (const r of rows) {
      const b = r.bible || s.bible;
      if (b && r.address?.book && r.address?.chapter)
        ensureChapter(b, r.address.book, r.address.chapter);
    }
  }, 300);
}

/* ═══════════════════════ Derived state ═══════════════════════ */
const address  = van.derive(() => ({ bible: s.bible,  book: s.book, chapter: s.chapter, verse: s.verse, vcount: s.vcount }));
const address2 = van.derive(() => ({ bible: s.bible2, book: s.book, chapter: s.chapter, verse: s.verse, vcount: s.vcount }));

const books1        = van.derive(() => bibles[s.bible]?.books || {});
const bookList      = van.derive(() => bibles[s.bible]?.bookslist || []);
const bookLength    = van.derive(() => { dataVersion.val; const b = books1.val[s.book]; return b?.chapterCount || Object.keys(b?.chapters || {}).length; });
const chapterLength = van.derive(() => { dataVersion.val; const b = books1.val[s.book]; return ((b?.chapters || {})[s.chapter] || []).length; });

const parsedFilter = van.derive(() => parseFilter(bookFilter.val));
const filteredBooks = van.derive(() => {
  const list = bookList.val;
  const q = parsedFilter.val.bookQuery;
  return q ? list.filter(b => matchesBook(b, q)) : list;
});

const addressNext  = van.derive(() => nextVerse({ ...address.val }));
const address2Next = van.derive(() => nextVerse({ ...address2.val }));
const line2Next    = van.derive(() => addressContent(addressNext.val,  s.verseNumbers));
const line4Next    = van.derive(() => addressContent(address2Next.val, s.verseNumbers));

/* ═══════════════════════ Effects ═══════════════════════ */
// Keep the broadcast "program" lines in sync with the current address.
van.derive(() => { s.line1 = addressAsString(address.val, s.showTranslation); });
van.derive(() => { s.line2 = addressContent(address.val, s.verseNumbers); });
van.derive(() => { address2.val; s.line3 = addressAsString(address2.val, s.showTranslation); });
van.derive(() => { address2.val; s.line4 = addressContent(address2.val, s.verseNumbers); });

// Lazy-load the current and next chapter for both bible panes.
van.derive(() => ensureChapter(address.val.bible,     address.val.book,     address.val.chapter));
van.derive(() => ensureChapter(addressNext.val.bible, addressNext.val.book, addressNext.val.chapter));
van.derive(() => { if (address2.val.bible)     ensureChapter(address2.val.bible,     address2.val.book,     address2.val.chapter); });
van.derive(() => { if (address2Next.val.bible) ensureChapter(address2Next.val.bible, address2Next.val.book, address2Next.val.chapter); });

// Re-run content search when the translation ( | indexes only for static ones) or
// the chosen indexer changes.
van.derive(() => { s.bible; runContentSearch(); });

/* ═══════════════════════ Pure helpers ═══════════════════════ */
// normalise for matching: strip diacritics, lowercase, drop dots and whitespace
const norm = (s) => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[.\s]+/g, "");

function matchesBook(book, prefix = "") {
  prefix = norm(prefix);
  if (!prefix) return true;
  const name = norm(book.name);
  return (
    name.startsWith(prefix) ||
    norm(book.abbreviation).startsWith(prefix) ||
    norm(book.abb || "").startsWith(prefix) ||
    (book.aliases && book.aliases.some(a => norm(a).startsWith(prefix))) ||
    (prefix.length >= 2 && name.includes(prefix))
  );
}

// Parse a ProPresenter-style query: "<book> [chapter] [verse]".
// Trailing numeric tokens (incl. "ch:vs" and "vs-vs") are the address;
// everything before that is the book query. Returns { bookQuery, chapter, verse, vcount }.
function parseFilter(str) {
  const tokens = (str || "").trim().split(/\s+/).filter(Boolean);
  const addr = [];
  while (tokens.length && /^[\d:-]+$/.test(tokens[tokens.length - 1])) {
    addr.unshift(tokens.pop());
  }
  let chapter, verse, vcount;
  const cv = (t) => t.match(/^(\d+)(?::(\d+)(?:-(\d+))?)?(?:-(\d+))?$/);
  if (addr.length === 1) {
    const m = cv(addr[0]);
    if (m) {
      chapter = +m[1];
      if (m[2] !== undefined) { verse = +m[2]; if (m[3] !== undefined) vcount = +m[3] - +m[2] + 1; }
      else if (m[4] !== undefined) { verse = +m[1]; vcount = +m[4] - +m[1] + 1; chapter = undefined; }
    }
  } else if (addr.length >= 2) {
    const cm = cv(addr[0]);
    if (cm) chapter = +cm[1];
    const vm = addr[1].match(/^(\d+)(?:-(\d+))?$/);
    if (vm) { verse = +vm[1]; if (vm[2] !== undefined) vcount = +vm[2] - +vm[1] + 1; }
  }
  return { bookQuery: tokens.join(" ").trim(), chapter, verse, vcount };
}

// Pick the single best-matching book abbreviation for a free-text query.
function bestBookForQuery(query) {
  const list = bookList.val;
  if (!query) return undefined;
  const q = norm(query);
  if (!q) return undefined;
  let b = list.find(x => norm(x.abbreviation) === q || norm(x.abb || "") === q);
  if (b) return b.abbreviation;
  b = list.find(x => norm(x.name) === q);
  if (b) return b.abbreviation;
  b = list.find(x => (x.aliases || []).some(a => norm(a) === q));
  if (b) return b.abbreviation;
  b = list.find(x =>
    norm(x.name).startsWith(q) || norm(x.abbreviation).startsWith(q) ||
    norm(x.abb || "").startsWith(q) || (x.aliases || []).some(a => norm(a).startsWith(q)));
  if (b) return b.abbreviation;
  const filtered = list.filter(book => matchesBook(book, query));
  return filtered[0]?.abbreviation;
}

function equalAddresses(a, b) {
  return b !== undefined &&
    a.book == b.book && a.chapter == b.chapter &&
    a.verse == b.verse && a.vcount == b.vcount;
}

function addressAsString(a, showTranslation, useAbbrev = false) {
  if (!a || !a.bible) return "";
  const book = bibles[a.bible].books[a.book];
  if (!book) return "";
  const label = useAbbrev ? (book.abb || book.abbreviation || book.name) : book.name;
  let out = label + " " + a.chapter;
  if (a.verse) {
    out += "," + a.verse;
    if (a.vcount > 1) out += "-" + (+a.verse + a.vcount - 1);
  }
  if (showTranslation) out += ` (${bibles[a.bible].identifier.toUpperCase()})`;
  return out;
}

function addressContent(a, numbers) {
  dataVersion.val; // re-evaluate once chapter data arrives
  if (!a || !a.bible) return "";
  const book = bibles[a.bible].books[a.book];
  if (!book || !book.chapters) return "";
  let content = "";
  if (a.verse && book.chapters[a.chapter]) {
    for (let i = +a.verse; i < +a.verse + a.vcount; i++) {
      content += "\n";
      if (numbers) content += `<sup>${i}</sup>`;
      content += book.chapters[a.chapter][i - 1] || "";
    }
  }
  return content;
}

// first verse line for a content-search hit, blank until its chapter loads
function snippet(r) {
  dataVersion.val;
  const b = r.bible || s.bible;
  const book = bibles[b]?.books?.[r.address.book];
  return book?.chapters?.[r.address.chapter]?.[r.address.verse - 1] || "";
}

/* ═══════════════════════ Mutators ═══════════════════════ */
function addToHistory(a) {
  const next = [{ book: a.book, chapter: a.chapter, verse: a.verse, vcount: a.vcount }, ...history.val];
  history.val = next.filter((h, i) => i === 0 || !equalAddresses(h, a));
}
const removeHistory = (i) => () => { history.val = history.val.filter((_, idx) => idx !== i); };

// Apply the current search field as a ProPresenter-style address on Enter.
// Pressing Enter again with an unchanged field toggles Show/Hide, so the same
// key navigates and then flips the display without touching the mouse.
let lastAppliedFilter = null;
function applyFilter() {
  const value = bookFilter.val;
  if (value === lastAppliedFilter) { toggleShown(); return; }
  lastAppliedFilter = value;
  const p = parseFilter(value);
  if (p.bookQuery) {
    const abbr = bestBookForQuery(p.bookQuery);
    if (abbr) {
      s.book = abbr;
      if (p.chapter === undefined) { s.chapter = 1; s.verse = 1; s.vcount = 1; }
    }
  }
  if (p.chapter !== undefined) {
    s.chapter = p.chapter;
    s.verse = p.verse ?? 1;
    s.vcount = p.vcount ?? 1;
  }
  if (s.hideOnSelector && !p.chapter && p.bookQuery) s.show = false;
}

// Content-search hit: first activation applies its address to state, the next
// activation of the same hit toggles Show (mirrors applyFilter's two-Enter).
function applyResult(r) {
  const a = r.address;
  const key = `${r.bible}:${a.book}:${a.chapter}:${a.verse}`;
  if (key === lastAppliedHit) { toggleShown(); return; }
  lastAppliedHit = key;
  if (r.bible) s.bible = r.bible;
  s.book = a.book;
  s.chapter = a.chapter || "";
  s.verse = a.verse || "";
  s.vcount = a.vcount || 1;
}

// Keyboard navigation between the filtered book list and the search field.
function focusBookItem(offset) {
  const items = Array.from(document.querySelectorAll(".books-filter .book-item"));
  if (!items.length) return;
  const cur = document.activeElement;
  const i = items.indexOf(cur);
  let target;
  if (i < 0) target = offset > 0 ? items[0] : items[items.length - 1];
  else target = items[Math.max(0, Math.min(items.length - 1, i + offset))];
  if (target) target.focus();
}
function focusHit(offset) {
  const items = Array.from(document.querySelectorAll(".search-results .hit"));
  if (!items.length) return;
  const cur = document.activeElement;
  const i = items.indexOf(cur);
  let target;
  if (i < 0) target = offset > 0 ? items[0] : items[items.length - 1];
  else target = items[Math.max(0, Math.min(items.length - 1, i + offset))];
  if (target) target.focus();
}
function hitKeydown(e) {
  if (e.key === "ArrowDown") { e.preventDefault(); focusHit(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); focusHit(-1); }
  else if (e.key === "Escape") { e.preventDefault(); document.querySelector(".search-row .input-group:last-child input")?.focus(); }
}
function filterKeydown(e) {
  if (e.key === "Enter") { e.preventDefault(); applyFilter(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); focusBookItem(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); focusBookItem(-1); }
  else if (e.key === "Escape") { e.preventDefault(); e.target.value = ""; bookFilter.val = ""; }
}
function bookItemKeydown(e) {
  if (e.key === "ArrowDown") { e.preventDefault(); focusBookItem(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); focusBookItem(-1); }
  else if (e.key === "Escape") { e.preventDefault(); bookFilter.val = ""; document.querySelector('.input-group input')?.focus(); }
}

const addressSelector = (a) => () => {
  if (s.hideOnSelector) s.show = false;
  s.book = a.book;
  s.chapter = a.chapter || "";
  s.verse = a.verse || "";
  s.vcount = a.vcount || 1;
  // chapters load lazily via the ensureChapter effects above
};

function toggleShown() {
  s.show = !s.show;
  if (s.show) addToHistory(address.val);
}
const sendToProgram = () => {};

/* navigation operates on a copy of an address */
function prevBook(a) {
  const list = bibles[s.bible].bookslist;
  a.book = list[(books1.val[a.book].index - 1 + list.length) % list.length].abbreviation;
  return a;
}
function nextBook(a) {
  const list = bibles[s.bible].bookslist;
  a.book = list[(books1.val[a.book].index + 1) % list.length].abbreviation;
  return a;
}
function prevChapter(a) {
  a.chapter = +a.chapter - 1;
  if (a.chapter <= 0) {
    a = prevBook(a);
    a.chapter = books1.val[a.book]?.chapterCount || Object.keys(books1.val[a.book]?.chapters || {}).length;
  }
  return a;
}
function nextChapter(a) {
  a.chapter = +a.chapter + 1;
  if (a.chapter > bookLength.val) { a.chapter = 1; a = nextBook(a); }
  a.verse = 1;
  return a;
}
function prevVerse(a) {
  a.verse = +a.verse - a.vcount;
  if (a.verse <= 0) {
    a = prevChapter(a);
    a.verse = books1.val[a.book]?.chapters?.[a.chapter]?.length || 1;
  }
  return a;
}
function nextVerse(a) {
  a.verse = +a.verse + a.vcount;
  if (a.verse > chapterLength.val) a = nextChapter(a);
  return a;
}

function gotoPrevVerse() { s.verse = Math.max(1, s.verse - s.vcount); }
function gotoNextVerse() {
  const a = nextVerse({ ...address.val });
  s.book = a.book; s.chapter = a.chapter; s.verse = a.verse;
}

const changeBible1 = (e) => { s.bible = e.target.value; };
const changeBible2 = (e) => { s.bible2 = e.target.value; };

// adapter so NumberPad writes through the broadcasting setter
const bind = (key) => ({ get: () => s[key], set: (v) => { s[key] = v; } });

/* ═══════════════════════ Components ═══════════════════════ */
function NumberPad({ value, max = 99999999 }) {
  const maxOf = () => {
    const m = max && typeof max === "object" && "val" in max ? max.val : Number(max);
    return m >= 1 ? m : 99999999;
  };
  const press = (n) => () => value.set(Math.min((+value.get() || 0) * 10 + n, maxOf()));
  const backspace = () => value.set(Math.floor(+value.get() / 10) || "");
  const clear = () => value.set("");
  return div({ class: "numberpad" },
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n =>
      button({ class: "btn btn-primary", onclick: press(n) }, n)),
    button({ class: "btn btn-primary", onclick: backspace, disabled: () => !value.get() }, "←"),
    button({ class: "btn btn-primary", onclick: press(0) }, "0"),
    button({ class: "btn btn-primary", onclick: clear,     disabled: () => !value.get() }, "C"),
  );
}

/* Reactive container: whenever its van dependencies change, render() is re-run
   and the element's children are replaced by whatever it returns
   (DOM node | array | string | null). Needed because VanJS stringifies arrays
   returned from function children (=> "[object HTMLButtonElement]"). */
function appendAll(el, out) {
  if (out == null || out === false) return;
  if (Array.isArray(out)) for (const c of out) appendAll(el, c);
  else el.append(out);
}
function live(tag, props, render) {
  const el = tag(props);
  van.derive(() => { el.replaceChildren(); appendAll(el, render()); });
  return el;
}

// a div whose innerHTML tracks a state/derive of an HTML string
function previewDiv(className, html$) {
  const el = div({ class: className });
  van.derive(() => { el.innerHTML = html$.val ?? ""; });
  return el;
}

// a <select> that keeps its value in sync with a reactive getter.
// `options` are option SPEC objects ({value,label}); fresh <option> nodes are built
// for each select so they're never shared.
function boundSelect(getValue, onchange, options) {
  const el = select({ onchange }, options.map(o => option({ value: o.value }, o.label)));
  van.derive(() => { el.value = String(getValue()); });
  return el;
}

/* ═══════════════════════ App ═══════════════════════ */
function BibleApp() {
  // connect to the sync transport (default: gun); room/password come from the URL
  s.connectFromUrl({ space: "bible" });

  const mainPreview  = previewDiv("preview",       van.derive(() => `${s.line1}<br/>${s.line2}`));
  const nextPreview  = previewDiv("preview next",  line2Next);
  const main2Preview = previewDiv("preview",       van.derive(() => `${s.line3}<br/>${s.line4}`));
  const next2Preview = previewDiv("preview next",  line4Next);

  return div({},
    // two search boxes side by side: address (left) + content (right)
    div({ class: "search-row" },
      // address / book search
      div({ class: "input-group" },
        input({ class: "form-control", type: "search", autofocus: true,
                placeholder: "Kniha kapitola verš (napr. Jn 3 16)",
                value: () => bookFilter.val,
                oninput: (e) => bookFilter.val = e.target.value,
                onkeydown: filterKeydown }),
      ),
      // full-text content search
      div({ class: "input-group" },
        input({ class: "form-control", type: "search",
                placeholder: () => hasSearchIndex(s.bible) ? "Hľadať v texte…" : "Bez indexu (API preklad)",
                disabled: () => !hasSearchIndex(s.bible),
                value: () => contentQuery.val,
                oninput: onContentInput,
                onfocus: keepSearchOpen,
                onblur: scheduleSearchHide,
                onkeydown: (e) => {
                  if (e.key === "Escape") { contentQuery.val = ""; searchResults.val = []; }
                  else if (e.key === "ArrowDown") { e.preventDefault(); focusHit(1); }
                  else if (e.key === "ArrowUp") { e.preventDefault(); focusHit(-1); }
                } }),
      ),
    ),
    // content-search results (under both input boxes)
    live(div, {
      class: () => "search-results" + (searchOpen.val ? "" : " closed"),
      onfocusin: keepSearchOpen,
      onfocusout: (e) => {
        const rt = e.relatedTarget;
        if (!rt || !e.currentTarget.contains(rt)) scheduleSearchHide();
      },
    },
      () => {
        if (searchStatus.val === "loading") return div({ class: "placeholder" }, "Načítavam index…");
        if (searchStatus.val === "error")   return div({ class: "placeholder" }, "Chyba indexu");
        if (searchStatus.val === "No index"){ return div({ class: "placeholder" }, "Preklad bez lokálneho indexu"); }
        if (!contentQuery.val.trim()) return null;
        if (!searchResults.val.length) return div({ class: "placeholder" }, "Bez výsledkov");
        return searchResults.val.map(r =>
          button({ class: "hit",
                   onclick: () => applyResult(r),
                   onkeydown: hitKeydown },
            span({ class: "ref" }, () => addressAsString({ bible: r.bible || s.bible, ...r.address }, false, true)),
            span({ class: "text" }, () => snippet(r))));
      }),
    // books + history + number-pad controls sit in one flex row so that,
    // on wide screens, the lists stretch to the number-pad height.
    div({ class: "control-row" },
      live(div, { class: "books-filter" },
        () => filteredBooks.val.map(b =>
          button({ class: () => `book-item btn ${b.abbreviation === s.book ? "btn-primary" : ""}`,
                   onclick: addressSelector({ book: b.abbreviation }),
                   onkeydown: bookItemKeydown }, b.name))),

      // history
      live(div, { class: "address-filter" },
        () => history.val.map((addr, i) =>
          div({ class: "address-item btn-group" },
            button({ class: () => `address-set btn ${equalAddresses(addr, address.val) ? "btn-primary" : ""}`,
                     onclick: addressSelector(addr) },
                   () => addressAsString({ bible: s.bible, ...addr }) || `${addr.book} ${addr.chapter},${addr.verse}`),
            button({ class: "btn btn-secondary address-remove", onclick: removeHistory(i) }, "×"),
          ))),

      // chapter controls
      div({ class: "control-block" },
      () => `Kapitola: ${s.chapter} z ${bookLength.val}`,
      NumberPad({ value: bind("chapter"), max: bookLength }),
      button({ class: "btn btn-primary", onclick: () => s.chapter = Math.max(1, s.chapter - 1) }, "⇦"),
      button({ class: "btn btn-primary", onclick: () => s.chapter = Math.min(s.chapter + 1, bookLength.val) }, "⇨"),
      br(),
      live(span, { class: "live" },
        () => s.splitButton
          ? [
              button({ class: "control-button btn btn-success",
                       onclick: () => { s.program = { line1: s.line1, line2: s.line2, line3: s.line3, line4: s.line4 }; } }, "Zobraziť"),
              button({ class: "btn btn-danger",
                       onclick: () => { s.program = {}; } }, "×"),
            ]
          : button({ class: () => `btn control-button ${s.show ? "btn-danger" : "btn-success"}`,
                     onclick: toggleShown },
                   () => s.show ? "Skryť" : "Zobraziť")),
    ),

    // verse controls
    div({ class: "control-block" },
      () => `Verš: ${s.verse}${s.vcount > 1 ? ` - ${+s.verse + s.vcount - 1}` : ""} z ${chapterLength.val}`,
      NumberPad({ value: bind("verse"), max: chapterLength }),
      button({ class: "btn btn-primary", onclick: gotoPrevVerse, disabled: () => s.verse <= 1 }, "⇦"),
      button({ class: "btn btn-primary", onclick: gotoNextVerse, disabled: () => +s.verse + s.vcount > chapterLength.val }, "⇨"),
      br(),
      button({ disabled: true, class: "spacer", "aria-label": "empty" }),
      button({ class: "btn btn-primary", onclick: () => { s.vcount -= 1; }, disabled: () => s.vcount <= 1 }, "-1"),
      button({ class: "btn btn-primary", onclick: () => { s.vcount += 1; }, disabled: () => s.vcount > chapterLength.val }, "+1"),
      br(),
      button({ disabled: true, class: "spacer", "aria-label": "empty" }),
    ),
    ), // end .control-row

    // previews
    mainPreview,
    // NOTE: must be wrapped in live() — a bare function child returning a DOM
    // node gets stringified by VanJS on re-evaluation (only the first run
    // appends the node), so toggling showNextVerses off→on would stop
    // re-inserting nextPreview. live() replaces children on every re-run.
    live(span, { class: "live" }, () => s.showNextVerses ? nextPreview : null),
    live(span, { class: "live" }, () => {
      if (!s.bible2) return null;
      const out = [main2Preview];
      if (s.showNextVerses) out.push(next2Preview);
      return out;
    }),

    br(),

    // settings
    div({ class: "settings" },
      div({ class: "bible" }, "Preklad: ",
        boundSelect(() => s.bible, changeBible1, bibleOptionSpecs)),
      div({ class: "bible" }, "Preklad 2: ",
        boundSelect(() => s.bible2, changeBible2, [{ value: "", label: "Žiadny" }, ...bibleOptionSpecs])),
      div({ class: "theme" }, "Téma: ",
        boundSelect(() => s.theme, (e) => s.theme = e.target.value, [
          { value: "", label: "Predvolená" },
          { value: "simple-with-shadow", label: "Jednoduché s tieňom" },
          { value: "fullscreen-white-bg", label: "Fullscreen biele pozadie" },
        ])),
      div({ class: "bible" }, label(
        input({ type: "checkbox", checked: () => s.showTranslation, onchange: (e) => s.showTranslation = e.target.checked }),
        " Zobraziť preklad")),
      div({ class: "bible" }, label(
        input({ type: "checkbox", checked: () => s.verseNumbers, onchange: (e) => s.verseNumbers = e.target.checked }),
        " Čísla veršov")),
      div({ class: "bible" }, label(
        input({ type: "checkbox", checked: () => s.showNextVerses, onchange: (e) => s.showNextVerses = e.target.checked }),
        " Nasledujúce verše")),
      div({ class: "bible" }, label(
        input({ type: "checkbox", checked: () => s.hideOnSelector, onchange: (e) => s.hideOnSelector = e.target.checked }),
        " Skryť pri výbere knihy")),
      div({ class: "bible" }, label(
        input({ type: "checkbox", checked: () => s.splitButton, onchange: (e) => s.splitButton = e.target.checked }),
        " Texty do programu až po kliknutí")),
    ),
  );
}

van.add(document.body, BibleApp());
</script>
</head>
